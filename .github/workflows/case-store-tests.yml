name: Complaint Store Tests

on:
  push:
  pull_request:

jobs:
  case-store-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Test persistence and batch signals
        run: python -m pytest backend/tests/test_case_store.py -q
